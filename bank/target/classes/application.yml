server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: jizhang-server

  # === 默认使用 H2 内存数据库（无需安装 MySQL 即可启动） ===
  # === 如果要切换到 MySQL，注释掉 h2 段，取消 mysql 注释 ===

  # H2 文件数据库（持久化 + UTF-8）
  datasource:
    url: jdbc:h2:file:./data/jizhang;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  # MySQL 配置（需要时取消注释）
#  datasource:
#    url: jdbc:mysql://localhost:3306/jizhang?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    username: root
#    password: 123456

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update       # 自动建表/更新表结构
    show-sql: false          # 开发时改为 true 可看SQL
    open-in-view: false
